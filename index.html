<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>地籍任務｜管理頁</title>
    <link rel="stylesheet" href="vendor/leaflet.css" />
    <link rel="stylesheet" href="admin-history.css?v=20261105-history1" />
    <link rel="stylesheet" href="style.css?v=20261029-1" />
    <link rel="stylesheet" href="dispatch-tools.css?v=20261111-dispatch1" />
    <link rel="stylesheet" href="land-areas.css?v=20261111-area1" />
    <link rel="stylesheet" href="admin-basemap.css?v=20261111-ortho1" />
    <link rel="stylesheet" href="admin-monthly-stats.css?v=20261120-month1" />
    <link rel="stylesheet" href="admin-compact.css?v=20261120-compact1" />
  <link rel="stylesheet" href="document-task-import.css?v=20261123-bridge1" />
  </head>
  <body data-tab="list">
    <header>
      <div>
        <h1 id="title">地籍任務管理</h1>
      </div>
      <a href="photosheet-app.html">照片排版</a>
    </header>
    <main>
      <div class="admin-overview">
      <section class="panel" id="admin-tools">
        <div class="toolbar">
          <button class="primary" id="import-document-tasks">匯入文件任務</button
          ><button id="manual-task">新增任務</button
          ><button id="import-geo">匯入地籍</button
          ><button id="land-areas">配對面積</button
          ><button id="auto-assign">自動分派</button
          ><button id="people">三人設定</button
          ><button id="backup">下載備份</button
          ><button id="restore">還原備份</button
          ><button id="dispatch-tools" class="primary">整理發布</button
          ><button id="publish">發布派工</button>
        </div>
        <details class="vendor-entrances">
          <summary>廠商入口</summary>
          <div class="toolbar">
            <a
              class="button"
              href="vendor-1.html"
              target="_blank"
              rel="noopener"
              >雜草垃圾廠商</a
            ><a
              class="button"
              href="vendor-2.html"
              target="_blank"
              rel="noopener"
              >砍樹廠商</a
            ><a
              class="button"
              href="vendor-3.html"
              target="_blank"
              rel="noopener"
              >圍籬廠商</a
            >
          </div>
        </details>
        <div id="geo-summary" class="status-bar">尚未匯入地籍資料</div>
        <div id="progress" hidden></div>
        <button id="cancel-geo" hidden>取消地籍匯入</button>
      </section>
      <section class="panel" id="worker-tools" hidden>
        <div id="worker-version"></div>
        <button id="reload-worker">重新整理派工資料</button>
        <p>
          照片只存於這台裝置，不會回傳。請下載備份；清除瀏覽器資料會移除暫存照片。
        </p>
      </section>
      <section class="panel monthly-stats" id="monthly-stats" aria-labelledby="monthly-stats-title">
        <div class="monthly-stats-heading">
          <h2 id="monthly-stats-title">每月統計</h2>
          <label>成果月份<select aria-label="統計月份" id="statistics-month"></select></label>
        </div>
        <table aria-label="各類型案件件數與地號筆數" aria-live="polite">
          <tbody></tbody>
        </table>
      </section>
      </div>
      <section class="admin-list-controls" aria-label="任務篩選">
      <div class="admin-list-summary">
        <div class="summary" id="summary"></div>
        <p id="task-date-scope" class="muted"></p>
      </div>
      <div class="toolbar admin-filters">
        <input
          id="search"
          placeholder="搜尋地段、地號、鄉鎮、案件編號"
          aria-label="搜尋任務"
        /><button id="find-last-month">搜尋上個月任務</button
        ><select id="type-filter" aria-label="工作類型">
          <option value="">全部類型</option>
          <option>雜草垃圾</option>
          <option>砍樹</option>
          <option>圍籬</option></select
        ><select id="person-filter" aria-label="負責人"></select
        ><select id="geo-filter" hidden aria-hidden="true">
          <option value="">全部</option>
        </select>
        <label
          >完成<select id="complete-filter">
            <option value="">全部</option>
            <option value="open">未完成</option>
            <option value="done">已完成</option>
          </select></label
        >
      <details id="date-filters" class="panel">
        <summary>依成果日期篩選</summary>
        <div class="toolbar">
          <label>起日<input id="date-from" type="date" /></label
          ><label>迄日<input id="date-to" type="date" /></label>
        </div>
      </details>
      </div>
      </section>
      <div class="mobile-tabs">
        <button data-tab="list" class="active">任務清單</button
        ><button data-tab="map">地圖核對</button>
      </div>
      <div class="layout">
        <section class="panel list-panel">
          <div class="toolbar">
            <button id="select-page">選取本頁</button
            ><button id="clear-select">清除選取</button
            ><span id="count" class="muted"></span>
          </div>
          <div id="tasks"></div>
          <div class="pages">
            <button id="prev">上一頁</button><span id="page"></span
            ><button id="next">下一頁</button>
          </div>
          <div id="batch" class="batch" hidden>
            <strong id="selected-count"></strong
            ><button id="batch-assign">分派／日期</button
            ><button id="batch-complete">標記已完成</button
            ><button id="boards">輸出白板</button
            ><button id="orders">輸出工作單</button>
          </div>
        </section>
        <section class="panel map-panel">
          <div class="toolbar">
            <button id="fit-map">縮放至目前任務</button
            ><button id="show-context">顯示附近地籍</button
            ><button id="pin-mode">點地圖設定入口</button>
          </div>
          <div id="map" class="map"></div>
          <p id="map-status" class="map-note"></p>
        </section>
      </div>
    </main>
    <div id="message" role="status" hidden></div>
    <input
      id="geo-files"
      type="file"
      multiple
      accept=".kml,.xml,.zip"
      hidden
    /><input id="restore-file" type="file" accept=".json" hidden />
    <dialog id="dialog">
      <div class="dialog-head">
        <h2 id="dialog-title"></h2>
        <button id="close-dialog" aria-label="關閉">×</button>
      </div>
      <div id="dialog-body"></div>
    </dialog>
    <script src="vendor/leaflet.js"></script>
    <script src="vendor/fflate.js"></script>
    <script src="vendor/exceljs.js"></script>
    <script src="vendor/rbush.js"></script>
    <script src="vendor/exifr.js"></script>
    <script src="vendor/jspdf.js"></script>
    <script src="core.js?v=20261105-history1"></script>
    <script src="db.js"></script>
    <script src="whiteboard.js?v=20261029-1"></script>
    <script src="documents.js?v=20261029-1"></script>
    <script src="camera.js?v=20261029-1"></script>
    <script src="manual-tasks.js?v=20261029-1"></script>
    <script src="admin-history.js?v=20261105-history1"></script>
    <script src="dispatch-plan.js?v=20261111-area1"></script>
    <script src="dispatch-tools.js?v=20261111-dispatch1"></script>
    <script src="land-area-core.js?v=20261111-area1"></script>
    <script src="land-areas.js?v=20261111-area-codes1"></script>
    <script src="admin-basemap.js?v=20261111-ortho1"></script>
    <script src="admin-monthly-stats.js?v=20261120-month1"></script>
    <script src="document-task-core.js?v=20261123-bridge1"></script>
    <script src="document-task-import.js?v=20261123-bridge1"></script>
    <script src="app.js?v=20261123-document-tasks2"></script>
  </body>
</html>
